name: Publish Signed GitHub APK Update

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: Public release notes shown in ScoreX
        required: true
        default: Bug fixes and performance improvements.
        type: string
      force_update:
        description: Mark this update as required
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: scorex-signed-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check required signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" || { echo "::error::Missing ANDROID_KEYSTORE_BASE64 repository secret"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing ANDROID_KEYSTORE_PASSWORD repository secret"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing ANDROID_KEY_ALIAS repository secret"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing ANDROID_KEY_PASSWORD repository secret"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.1'
          channel: stable
          cache: true

      - name: Configure stable Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/scorex-upload.jks
          test -s android/scorex-upload.jks
          cat > android/key.properties <<EOF
          storeFile=scorex-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          chmod 600 android/key.properties android/scorex-upload.jks

      - name: Install dependencies and test
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build split APKs with stable signature
        run: flutter build apk --flavor github --release --split-per-abi

      - name: Verify APK signatures and package ID
        run: |
          set -euo pipefail
          mkdir -p release-assets
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -1)"
          APKSIGNER="$(find "$SDK_ROOT" -type f -name apksigner 2>/dev/null | sort -V | tail -1)"
          test -n "$APKANALYZER"
          test -n "$APKSIGNER"
          found=0
          for apk in build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -f "$apk" ] || continue
            "$APKSIGNER" verify --verbose "$apk"
            PKG="$("$APKANALYZER" manifest application-id "$apk")"
            [ "$PKG" = "com.scorex.app.scorex" ] || { echo "::error::Unexpected package $PKG"; exit 1; }
            FILE="$(basename "$apk")"
            case "$FILE" in
              *armeabi-v7a*) ABI=armeabi-v7a ;;
              *arm64-v8a*) ABI=arm64-v8a ;;
              *x86_64*) ABI=x86_64 ;;
              *) echo "::error::Could not determine APK ABI from $FILE"; exit 1 ;;
            esac
            cp "$apk" "release-assets/scorex-$ABI.apk"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "::error::No split APKs were built"; exit 1; }

      - name: Prepare release identity
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -1)"
          NAME="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          test "$NAME" != "$VERSION"
          test "$BUILD" != "$VERSION"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=scorex-v$NAME-build$BUILD" >> "$GITHUB_OUTPUT"

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Increase version/build in pubspec.yaml before publishing again."
            exit 1
          fi
          gh release create "$TAG" --title "ScoreX $VERSION_NAME" --notes "$RELEASE_NOTES" --draft
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Generate verified update.json
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
          FORCE_UPDATE: ${{ inputs.force_update }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export APKANALYZER="$(find "$SDK_ROOT" -type f -name apkanalyzer 2>/dev/null | sort -V | tail -1)"
          test -n "$APKANALYZER"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          analyzer = os.environ["APKANALYZER"]
          assets = {}
          for path in sorted(pathlib.Path("release-assets").glob("*.apk")):
              abi = path.stem.removeprefix("scorex-")
              version_code = int(subprocess.check_output([analyzer, "manifest", "version-code", str(path)], text=True).strip())
              data = path.read_bytes()
              assets[abi] = {
                  "url": f"https://github.com/wwwpan206mr-bot/ScoreX/releases/download/{os.environ['RELEASE_TAG']}/{path.name}",
                  "versionCode": version_code, "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest()
              }
          if not assets:
              raise SystemExit("No APK assets found")
          metadata = {
              "schemaVersion": 1,
              "versionName": os.environ["VERSION_NAME"],
              "releaseNotes": os.environ["RELEASE_NOTES"],
              "forceUpdate": os.environ["FORCE_UPDATE"].lower() == "true",
              "assets": assets
          }
          pathlib.Path("release-assets/update.json").write_text(json.dumps(metadata, indent=2) + "\\n")
          print(json.dumps(metadata, indent=2))
          PY

      - name: Upload APKs and publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" release-assets/*.apk release-assets/update.json
          gh release edit "$TAG" --draft=false --latest
