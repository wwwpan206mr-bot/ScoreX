name: Play Store Signed Release
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SCOREX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/scorex-upload.jks
      API_BASE_URL: ${{ vars.API_BASE_URL }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android platform files
        run: |
          flutter create --platforms=android --org com.scorex.app .
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config_path = pathlib.Path('assets/branding/firebase_config.json')
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          config = json.loads(override if override else config_path.read_text())
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Restore stable upload signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SCOREX_KEYSTORE_PATH"
          python3 scripts/configure_play_signing.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze and test
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build smaller per-architecture release APKs
        run: flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Build Play Store App Bundle
        run: flutter build appbundle --release --tree-shake-icons --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Export actual APK signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools_dir/apksigner" verify --print-certs "$apk_path" | tee scorex-signing-fingerprints.txt
          {
            echo '### ScoreX APK certificate fingerprints'
            echo 'These fingerprints belong to the ARM64 APK in this workflow run.'
            echo 'Register its SHA-1 and SHA-256 in Firebase for this APK.'
            echo 'This build uses the stable upload key from repository secrets. Play installs use the separate Play app signing certificate.'
            echo '```text'
            cat scorex-signing-fingerprints.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show file sizes
        run: du -h build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab
      - name: Upload release APKs and AAB
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scorex-play-signed-release
          path: |
            scorex-signing-fingerprints.txt
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$SCOREX_KEYSTORE_PATH"
