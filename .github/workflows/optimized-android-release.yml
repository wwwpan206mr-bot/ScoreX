name: Optimized Android Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/optimized-android-release.yml'

# GitHub manages and updates the hosted runner software.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SCOREX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/scorex-upload.jks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Restore Android platform files
        run: |
          flutter create --platforms=android --org com.scorex.app .
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
      - name: Use the stable signing identity when configured
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SCOREX_KEYSTORE_PATH"
            python3 scripts/configure_play_signing.py
          else
            echo 'Development signing only. Use Publish Signed GitHub APK Update for distributable in-app updates.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config_path = pathlib.Path('assets/branding/firebase_config.json')
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          config = json.loads(override if override else config_path.read_text())
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Configure AdMob placements
        env:
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
        run: python3 scripts/configure_ads.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze and test before packaging
        run: |
          flutter analyze --no-fatal-infos
          flutter test
      - name: Build smaller per-architecture release APKs
        run: flutter build apk --flavor github --release --split-per-abi --tree-shake-icons --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Build Play Store App Bundle
        run: flutter build appbundle --flavor play --release --tree-shake-icons --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Export actual APK signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/app-github-arm64-v8a-release.apk
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools_dir/apksigner" verify --print-certs "$apk_path" | tee scorex-signing-fingerprints.txt
          {
            echo '### ScoreX APK certificate fingerprints'
            echo 'These fingerprints belong to the ARM64 APK in this workflow run.'
            echo 'Register its SHA-1 and SHA-256 in Firebase for this APK.'
            echo 'Signing is stable only when the repository keystore secrets are configured.'
            echo '```text'
            cat scorex-signing-fingerprints.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show file sizes
        run: du -h build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/playRelease/*.aab
      - name: Upload release APKs and AAB
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorex-optimized-android-release
          path: |
            scorex-signing-fingerprints.txt
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/playRelease/*.aab
          if-no-files-found: error


      - name: Remove signing key
        if: always()
        run: rm -f "$SCOREX_KEYSTORE_PATH"
