name: Optimized Android Release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - 'android/**'
      - '.github/workflows/optimized-android-release.yml'

# GitHub manages the hosted runner version; do not pin obsolete runner v2.328.0.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Restore Android platform files
        run: |
          flutter create --platforms=android --org com.scorex.app .
          test -f android/app/build.gradle || test -f android/app/build.gradle.kts
          test -f android/settings.gradle || test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config_path = pathlib.Path('assets/branding/firebase_config.json')
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          config = json.loads(override if override else config_path.read_text())
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Configure AdMob placements
        env:
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
        run: python3 scripts/configure_ads.py
      - name: Install dependencies
        run: flutter pub get
      - name: Build smaller per-architecture release APKs
        run: flutter build apk --release --split-per-abi --tree-shake-icons --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Build Play Store App Bundle
        run: flutter build appbundle --release --tree-shake-icons --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}
      - name: Export actual APK signing fingerprints
        shell: bash
        run: |
          set -euo pipefail
          apk_path=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          build_tools_dir=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$build_tools_dir/apksigner" verify --print-certs "$apk_path" | tee scorex-signing-fingerprints.txt
          {
            echo '### ScoreX APK certificate fingerprints'
            echo 'These fingerprints belong to the ARM64 APK in this workflow run.'
            echo 'Register its SHA-1 and SHA-256 in Firebase for this APK.'
            echo 'Current builds still need a stable production signing key; a later run may use a different certificate.'
            echo '```text'
            cat scorex-signing-fingerprints.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Show file sizes
        run: du -h build/app/outputs/flutter-apk/*.apk build/app/outputs/bundle/release/*.aab
      - name: Upload release APKs and AAB
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scorex-optimized-android-release
          path: |
            scorex-signing-fingerprints.txt
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error
