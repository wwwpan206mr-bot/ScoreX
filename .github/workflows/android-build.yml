name: ScoreX Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'README.md'
      - 'pubspec.yaml'
      - '.github/workflows/android-build.yml'
      - 'cloudflare/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.3.1
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform folders
        run: flutter create . --platforms=android,ios --org com.scorex.app
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config = json.loads(os.environ.get('FIREBASE_CONFIG_JSON') or '{}')
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Build release-mode Android App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: scorex-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
