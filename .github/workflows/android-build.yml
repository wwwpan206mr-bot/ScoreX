name: ScoreX Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'README.md'
      - 'pubspec.yaml'
      - '.github/workflows/android-build.yml'
      - 'cloudflare/**'
      - 'scripts/**'

permissions:
  contents: read

# GitHub manages and updates the hosted runner software.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform folders
        run: flutter create . --platforms=android,ios --org com.scorex.app
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config_path = pathlib.Path('assets/branding/firebase_config.json')
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          config = json.loads(override if override else config_path.read_text())
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Configure AdMob placements
        env:
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
        run: python3 scripts/configure_ads.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Set up Node.js 24 for proxy tests
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test cricket proxy pagination
        run: |
          node --test cloudflare/worker.test.mjs
          python3 -m unittest discover -s scripts -p '*_test.py' 
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --flavor github --debug --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Test native update validation
        working-directory: android
        run: ./gradlew :app:testGithubDebugUnitTest
      - name: Build release-mode Android App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build appbundle --flavor play --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Verify Play manifest omits APK install permission
        run: python3 scripts/check_play_update_manifest.py
      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorex-android-builds
          path: |
            build/app/outputs/flutter-apk/app-github-debug.apk
            build/app/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 7


