name: ScoreX Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'assets/**'
      - 'android/**'
      - 'test/**'
      - 'README.md'
      - 'pubspec.yaml'
      - '.github/workflows/android-build.yml'
      - 'cloudflare/**'

permissions:
  contents: read

# GitHub manages the hosted runner version; do not pin obsolete runner v2.328.0.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android and iOS platform folders
        run: flutter create . --platforms=android,ios --org com.scorex.app
      - name: Verify ScoreX launcher branding
        run: |
          test -s assets/branding/scorex_logo.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
      - name: Configure optional Firebase accounts
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          config_path = pathlib.Path('assets/branding/firebase_config.json')
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          config = json.loads(override if override else config_path.read_text())
          if config:
              for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId']:
                  assert isinstance(config.get(key), str) and config[key], 'Incomplete Firebase configuration'
          pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
      - name: Configure AdMob placements
        env:
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
        run: python3 scripts/configure_ads.py
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos
      - name: Set up Node.js 24 for proxy tests
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test cricket proxy pagination
        run: node --test cloudflare/worker.test.mjs
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --debug --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Build release-mode Android App Bundle
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build appbundle --release --dart-define=API_BASE_URL="${API_BASE_URL}"
      - name: Upload Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scorex-android-builds
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

