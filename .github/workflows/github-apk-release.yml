name: Publish Signed GitHub APK Update
on:
  workflow_dispatch:
    inputs:
      upgrade_check_run_id:
        description: Android Signed Upgrade Check run ID that must pass before publishing
        required: true
        type: string
      release_notes:
        description: Changes shown inside the app
        required: false
        type: string
      force_update:
        description: Require this update (use only for critical fixes)
        default: false
        type: boolean
  push:
    branches: [main]
    paths: ['.github/workflows/github-apk-release.yml']
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
jobs:
  configuration:
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.signing.outputs.ready }}
    steps:
      - name: Check stable signing configuration without exposing credentials
        id: signing
        env:
          KEY_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_DATA" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Stable release signing is configured. Use Run workflow to publish an update.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'No APK release was published. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD using your existing stable signing key, then Run workflow. Do not paste secrets into chat or source code.' >> "$GITHUB_STEP_SUMMARY"
          fi
  publish:
    needs: configuration
    if: github.event_name == 'workflow_dispatch' && needs.configuration.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    concurrency:
      group: scorex-signed-github-release
      cancel-in-progress: false
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SCOREX_KEYSTORE_PATH: ${{ github.workspace }}/android/app/scorex-upload.jks
      API_BASE_URL: ${{ vars.API_BASE_URL }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
      FORCE_UPDATE: ${{ inputs.force_update }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Restore platform files and stable signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          flutter create --platforms=android --org com.scorex.app .
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SCOREX_KEYSTORE_PATH"
          python3 scripts/configure_play_signing.py
      - name: Configure Firebase and AdMob
        env:
          FIREBASE_CONFIG_JSON: ${{ vars.FIREBASE_CONFIG_JSON }}
          ADMOB_TEST_MODE: ${{ vars.ADMOB_TEST_MODE }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ vars.ADMOB_BANNER_ID }}
          ADMOB_NATIVE_ID: ${{ vars.ADMOB_NATIVE_ID }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          override = os.environ.get('FIREBASE_CONFIG_JSON', '').strip()
          if override:
              config = json.loads(override)
              assert all(config.get(key) for key in ['apiKey', 'appId', 'messagingSenderId', 'projectId'])
              pathlib.Path('assets/branding/firebase_config.json').write_text(json.dumps(config))
          PY
          python3 scripts/configure_ads.py
      - name: Analyze and test release source
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          python3 -m unittest discover -s scripts -p '*_test.py'
      - name: Build signed GitHub APKs
        run: flutter build apk --flavor github --release --split-per-abi --tree-shake-icons --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Verify APKs and prepare metadata
        run: |
          set -euo pipefail
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          for apk in build/app/outputs/flutter-apk/app-*-github-release.apk; do
            "$build_tools/apksigner" verify "$apk"
          done
          python3 - <<'PY'
          import os, pathlib, re
          version, code = re.search(r'^version:\s*([0-9.]+)\+([0-9]+)', pathlib.Path('pubspec.yaml').read_text(), re.M).groups()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'RELEASE_TAG=github-v{version}-build{code}\n')
          pathlib.Path('release-notes.txt').write_text(os.environ.get('RELEASE_NOTES', '').strip() or 'ScoreX improvements and fixes.')
          PY
          # GITHUB_ENV is loaded by the following step.
      - name: Create install manifest
        run: |
          build_tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          python3 scripts/create_update_manifest.py --apk-dir build/app/outputs/flutter-apk --aapt "$build_tools/aapt" --tag "$RELEASE_TAG"
      - name: Require successful Android upgrade verification for this app source
        env:
          UPGRADE_CHECK_RUN: ${{ inputs.upgrade_check_run_id }}
        run: |
          set -euo pipefail
          [[ "$UPGRADE_CHECK_RUN" =~ ^[0-9]+$ ]]
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPGRADE_CHECK_RUN" --jq '.path')
          test "$workflow" = '.github/workflows/android-upgrade-check.yml'
          gh run watch "$UPGRADE_CHECK_RUN" --repo "$GITHUB_REPOSITORY" --exit-status
          verified_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$UPGRADE_CHECK_RUN" --jq '.head_sha')
          git fetch --no-tags --depth=1 origin "$verified_sha"
          git diff --exit-code "$verified_sha" "$GITHUB_SHA" -- lib android assets pubspec.yaml scripts
          echo 'Signed upgrade verification passed for the app source being published.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publish complete signed release
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'This release tag already exists. Increase pubspec version/build before publishing.'
            exit 1
          fi
          gh release create "$RELEASE_TAG" build/app/outputs/flutter-apk/app-*-github-release.apk update.json --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft --title "ScoreX $RELEASE_TAG" --notes-file release-notes.txt
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published signed update: $RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove signing key
        if: always()
        run: rm -f "$SCOREX_KEYSTORE_PATH"
